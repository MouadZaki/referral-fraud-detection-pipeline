# Stage 2 — local Airflow + MinIO stack (CSV -> validated Parquet on
# MinIO; the DAG itself arrives in a later story).
#
# Follows the official Apache Airflow docker-compose guidance
# (airflow-init -> webserver + scheduler, postgres metadata DB),
# simplified to LocalExecutor, same shape as the Stage 1 stack.
#
# Services:
#   airflow-postgres — Airflow's own metadata database (internal)
#   minio            — S3-compatible object store, Parquet target
#   minio-init       — one-shot, idempotent bucket creation via boto3
#                      on the Airflow image (safe to rerun)
#   airflow-init     — one-shot migrations + admin user
#   airflow-webserver, airflow-scheduler — the Airflow runtime
#
# Ports: Airflow UI on 8081 (Stage 1 keeps 8080), MinIO S3 API on 9000,
# MinIO console on 9001.
#
# All secrets come from .env (copy .env.example). The future
# dags/extraction/sample.csv is covered by the ./dags mount.

x-airflow-common: &airflow-common
  # Built from ./Dockerfile (apache/airflow:2.11.0-python3.11 + pinned
  # deps incl. pyarrow + amazon provider) — `docker compose up` builds
  # it when absent.
  image: ${AIRFLOW_IMAGE_NAME:-stage-2-airflow:2.11.0-py3.11}
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}@airflow-postgres:5432/${AIRFLOW_DB_NAME}
    # Dev only: no fernet key is acceptable for a local throwaway stack.
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    # Exposes the scheduler health server on :8974 (used by healthcheck).
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # MinIO target settings for the future DAG — it builds its own S3
    # client from these plain env vars (no Airflow connection URI, so
    # the password never sits inside a connection record/URI string).
    EXTRACTION_FILE: /opt/airflow/dags/extraction/sample.csv
    CONTRACT_DIR: /opt/airflow/contracts
    MINIO_ENDPOINT: minio:9000
    MINIO_BUCKET: ${MINIO_BUCKET}
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./3k-conversations:/opt/airflow/contracts:ro
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"

services:
  # --- Airflow's internal metadata database ---
  airflow-postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow-postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      retries: 5
      start_period: 5s

  # --- S3-compatible object store (Parquet target) ---
  minio:
    # Chainguard build, pinned by digest (verified pull). Entrypoint is
    # `minio`; this minimal image may lack mc/curl/shell, so there is
    # no in-container healthcheck — minio-init does the real readiness
    # probe over boto3 after the service starts.
    image: ${MINIO_IMAGE_NAME:-cgr.dev/chainguard/minio@sha256:3c60a2a8c4d33409a9bc7a623a7fcbfb4605adc3d89422d2f53b3f673a6e5597}
    user: "0:0"                        # run as root so /data is writable
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # web console
    volumes:
      - minio-data-volume:/data

  # --- One-shot bucket creation on the Airflow image (boto3 already
  # installed). Idempotent: succeeds when the bucket already exists.
  # Waits for `minio` to START, then the script itself probes readiness
  # — the minimal MinIO image provides no usable healthcheck command.
  minio-init:
    image: ${AIRFLOW_IMAGE_NAME:-stage-2-airflow:2.11.0-py3.11}
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: python
    command: /opt/minio-init/create_bucket.py
    volumes:
      - ./minio-init:/opt/minio-init:ro
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    depends_on:
      minio:
        condition: service_started

  # --- One-shot init: migrations + admin user (official env-flag pattern) ---
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: >-
      -c '
      mkdir -p /sources/logs /sources/dags /sources/plugins &&
      chown -R "${AIRFLOW_UID}:0" /sources/{logs,dags,plugins} 2>/dev/null || true;
      exec /entrypoint airflow version
      '
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:?Set _AIRFLOW_WWW_USER_PASSWORD in .env}
    user: "0:0"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}:/sources
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_WEB_PORT:-8081}:8080"   # Stage 1 keeps host :8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-postgres-db-volume:
  minio-data-volume:
